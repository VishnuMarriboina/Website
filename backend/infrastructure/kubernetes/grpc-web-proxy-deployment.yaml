apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-web-proxy
  labels:
    app: grpc-web-proxy
    tier: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grpc-web-proxy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: grpc-web-proxy
    spec:
      containers:
        - name: grpc-web-proxy
          image: microservices/grpc-web-proxy:latest
          ports:
            - containerPort: 8080
              name: grpc-web
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8080"
            - name: SERVICE_A_GRPC_HOST
              value: "service-a"
            - name: SERVICE_A_GRPC_PORT
              value: "50051"
            - name: SERVICE_B_GRPC_HOST
              value: "service-b"
            - name: SERVICE_B_GRPC_PORT
              value: "50052"
            - name: CORS_ORIGIN
              value: "https://your-frontend-domain.com"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
