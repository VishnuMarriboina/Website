worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # ── Logging
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  # ── Gzip
  gzip on;
  gzip_types text/plain application/json application/javascript text/css;
  gzip_min_length 1024;

  # ── Rate limiting zone
  limit_req_zone $binary_remote_addr zone=grpc:10m rate=30r/s;

  # ── gRPC-Web Proxy upstream
  upstream grpc_web_proxy {
    server grpc-web-proxy:8080;
    keepalive 32;
  }

  server {
    listen 8080;
    server_name _;

    client_max_body_size 10M;

    # ── Security headers
    add_header X-Frame-Options         "SAMEORIGIN"              always;
    add_header X-Content-Type-Options  "nosniff"                 always;
    add_header X-XSS-Protection        "1; mode=block"           always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── Health check (bypass rate limiting)
    location /health {
      proxy_pass         http://grpc_web_proxy/health;
      proxy_http_version 1.1;
      access_log         off;
    }

    # ── gRPC-Web routes (POST with application/grpc-web+proto content type)
    location / {
      limit_req zone=grpc burst=20 nodelay;

      proxy_pass         http://grpc_web_proxy;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";

      # gRPC-Web uses POST with binary body — disable buffering
      proxy_request_buffering  off;
      proxy_buffering          off;

      proxy_connect_timeout  10s;
      proxy_send_timeout     30s;
      proxy_read_timeout     30s;
    }
  }
}
