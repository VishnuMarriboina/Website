name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root deps
        run: npm install

      - name: Install backend deps
        run: npm --prefix backend install

      - name: Lint protobuf schemas
        run: npm --prefix backend run proto:lint

      - name: Check protobuf formatting
        run: npm --prefix backend run proto:format:check

      - name: Check protobuf breaking changes
        run: npx --prefix ./backend buf breaking backend/proto --against ".git#ref=origin/main,subdir=backend/proto"

      - name: Generate proto TypeScript types
        run: npm --prefix backend run proto:generate

      - name: Install service deps
        run: bash scripts/install-all.sh

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/test_db

  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push grpc-web-proxy
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./grpc-web-proxy/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/grpc-web-proxy:latest

      - name: Build and push service-a
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/service-a/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/service-a:latest

      - name: Build and push service-b
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/service-b/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/service-b:latest

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to K8s
        run: |
          kubectl apply -f infrastructure/kubernetes/
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
